services:
  - type: web
    name: cripto-agentes-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PRICE_ALERT_THRESHOLD
        value: 5.0
      - key: GEMINI_API_KEY
        sync: false
